<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge Remake</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen editor — menu bar, tool rail | map canvas | inspector, status bar. Stacks on phones. */
:root{
  --bg:#e7ebef; --panel:#f8fafb; --panel-2:#eef2f5; --line:#c3ccd6; --fg:#16202b; --muted:#566473;
  --accent:#b8650f; --accent-fg:#ffffff; --danger:#b93222; --ok:#2c7a4b; --warn:#9a6a00;
  --canvas-bg:#dde3e9; --grid:#d0d8e0; --grid-major:#b6c1cc; --poly:#a9b6c3; --wall:#18222d; --edge:#6b7b8c; --pt:#18222d; --orphan:#c0503c;
  --font-display:"Chakra Petch","Eurostile","Arial Narrow",sans-serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(10,20,30,.08); --titlebar:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1117; --panel:#131a22; --panel-2:#18212b; --line:#253140; --fg:#d9e2ea; --muted:#8a99a9;
  --accent:#efa23a; --accent-fg:#1b1204; --danger:#ff6f5e; --ok:#62cf8e; --warn:#e3b341;
  --canvas-bg:#0a0f15; --grid:#141d27; --grid-major:#1f2c3a; --poly:#283849; --wall:#c9d6e2; --edge:#566b80; --pt:#e8eff5; --orphan:#ff7b66;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1117; --panel:#131a22; --panel-2:#18212b; --line:#253140; --fg:#d9e2ea; --muted:#8a99a9;
  --accent:#efa23a; --accent-fg:#1b1204; --danger:#ff6f5e; --ok:#62cf8e; --warn:#e3b341;
  --canvas-bg:#0a0f15; --grid:#141d27; --grid-major:#1f2c3a; --poly:#283849; --wall:#c9d6e2; --edge:#566b80; --pt:#e8eff5; --orphan:#ff7b66;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
/* Retro: a deliberate single look — 1-bit Mac System 7 era, like the 1996 original */
html:root[data-ui="retro"]{
  --bg:#d6d6d6; --panel:#ffffff; --panel-2:#eeeeee; --line:#000000; --fg:#000000; --muted:#4a4a4a;
  --accent:#000000; --accent-fg:#ffffff; --danger:#c40000; --ok:#006b00; --warn:#7a5a00;
  --canvas-bg:#ffffff; --grid:#ececec; --grid-major:#c8c8c8; --poly:#bcbcbc; --wall:#000000; --edge:#808080; --pt:#000000; --orphan:#c40000;
  --font-display:"Pixelify Sans","Chicago","Geneva",monospace; --font-ui:"IBM Plex Mono",Monaco,"Courier New",monospace;
  --radius:0px; --shadow:2px 2px 0 #000; color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:auto minmax(0,1fr) 320px;
  grid-template-areas:"menu menu menu" "tools map side" "status status status";
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
/* menu bar */
.menu{grid-area:menu;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand small{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.mgroup{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--edge)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn kbd{font-family:var(--font-mono);font-size:10px;opacity:.65}
.spacer{flex:1}
/* tool rail */
.tools{grid-area:tools;display:flex;flex-direction:column;gap:4px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.tool{width:44px;height:44px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--radius);background:transparent;cursor:pointer;position:relative}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tool:hover{border-color:var(--line)}
.tool[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tool .k{position:absolute;right:3px;bottom:1px;font-family:var(--font-mono);font-size:9px;opacity:.6}
.tools hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
/* map */
.mapwrap{grid-area:map;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.optbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;min-height:38px}
.optbar label{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.optbar .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.optbar select,.optbar input[type=number]{padding:3px 5px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);max-width:190px}
.optbar input[type=number]{width:70px;font-family:var(--font-mono)}
.viewmodes{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.viewmodes button{border:0;padding:4px 8px;background:var(--panel);cursor:pointer;font-size:12px}
.viewmodes button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.canvasbox{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--canvas-bg)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-mono);font-size:11px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:calc(100% - 20px)}
.legend canvas{width:120px;height:10px;border:1px solid var(--line)}
.hint{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);max-width:min(340px,calc(100% - 20px))}
/* side panel */
.side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;white-space:nowrap;padding:8px 4px;border:0;background:transparent;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:.02em;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:8px;background:var(--danger);color:#fff;margin-left:4px}
.tabs .count.w{background:var(--warn)}
.tabs .count.z{background:var(--ok)}
.pane{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.pane h3{margin:0;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pane h3 small{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400}
.field{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center}
.field>span{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);min-width:0}
.field input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.field input[type=checkbox]{width:auto}
.unit{display:flex;align-items:center;gap:6px}.unit em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 12px}.checks label{display:inline-flex;gap:5px;align-items:center;font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.group{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.group:first-child{border-top:0;padding-top:0}
.glabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap}
.issue{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.issue i{width:8px;height:100%;min-height:28px;border-radius:2px;background:var(--danger)}
.issue.warn i{background:var(--warn)}
.issue b{font-weight:600;display:block;font-size:12px}
.issue span{font-size:12px;color:var(--muted)}
.issue .btn{padding:3px 8px;font-size:11px}
.empty{color:var(--muted);font-size:12px;padding:10px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}
.status{grid-area:status;display:flex;gap:14px;align-items:center;padding:5px max(12px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel);font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status .msg{color:var(--fg);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;text-align:right}
/* modals */
.modal{position:fixed;inset:0;background:rgba(5,10,15,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);box-shadow:0 20px 50px rgba(0,0,0,.35);width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.dialog header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dialog header h2{margin:0;font-family:var(--font-display);font-size:18px;letter-spacing:.03em}
.dialog .body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dialog footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dialog textarea{width:100%;min-height:96px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);resize:vertical;line-height:1.45}
.genout{font-family:var(--font-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px;white-space:pre-wrap;max-height:150px;overflow:auto;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.labelchips{display:flex;flex-wrap:wrap;gap:4px}.labelchips button{font:700 10px var(--font-mono,monospace);letter-spacing:.03em;padding:3px 7px;border-radius:3px;border:1px solid var(--lc);background:transparent;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.labelchips button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lc)}
.labelchips button[aria-pressed="true"]{background:var(--lc);color:#fff}.labelchips button[aria-pressed="true"]::before{background:#fff}
.levellist{display:flex;flex-direction:column;gap:4px}
.levellist button{text-align:left}
/* 3D */
.view3d{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.view3d canvas{flex:1;min-height:0;display:block;width:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));color:#e6edf3;font-family:var(--font-mono);font-size:12px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .btn{background:rgba(20,26,34,.85);border-color:#3a4654;color:#e6edf3}
.hud .btn.on{background:#e6edf3;color:#0c1117}
.hud .t{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.hud .help{opacity:.75}
.pad{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
.pad button{background:rgba(20,26,34,.8);border:1px solid #3a4654;color:#e6edf3;border-radius:8px;font-size:18px;touch-action:none;user-select:none}
.crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(230,240,250,.7)}
.crosshair:before{left:6px;top:0;width:2px;height:14px}.crosshair:after{top:6px;left:0;height:2px;width:14px}
.toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--radius);font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.texbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:2px solid transparent;border-radius:var(--radius);background:var(--panel-2);cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.texbtn canvas{image-rendering:pixelated;display:block}
.texbtn:hover{border-color:var(--edge)}.texbtn.on{border-color:var(--accent);color:var(--fg)}
.texpick{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);cursor:pointer;width:100%;font-family:var(--font-mono);font-size:12px}
.texpick canvas{image-rendering:pixelated;border:1px solid var(--line)}
.gamecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.gamecard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:var(--radius);background:var(--panel-2);cursor:pointer}
.gamecard b{font-family:var(--font-display);font-size:14px}.gamecard span{font-size:11px;color:var(--muted);line-height:1.35}.gamecard em{font-style:normal;font-size:11px;font-family:var(--font-mono);color:var(--fg)}
.gamecard[aria-pressed="true"]{border-color:var(--accent);background:var(--panel)}
.hud .seg{display:flex;gap:0}.hud .seg .btn{border-radius:0}.hud .seg .btn:first-child{border-radius:6px 0 0 6px}.hud .seg .btn:last-child{border-radius:0 6px 6px 0}
.hud .help{flex-basis:100%;opacity:.75;font-size:11px}
.paintbar{position:absolute;left:0;right:0;bottom:0;background:rgba(10,14,20,.88);border-top:1px solid #3a4654;color:#e6edf3;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.paintinfo{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;font-family:var(--font-mono);font-size:12px}
.paintkeys{opacity:.65;font-size:11px}
.palette{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.texbtn span.sp{font-size:9px;color:var(--muted);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .texbtn{background:#18202a;color:#9fb0c0;flex:0 0 auto}.palette .texbtn.on{border-color:#ffb040;color:#fff}
.issue.ok i{background:var(--ok)}
.dialog.wide{width:min(1100px,100%)}
.termed{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,320px);gap:10px;min-height:420px}
.termlist{display:flex;flex-direction:column;gap:4px;overflow-y:auto;max-height:60vh}
.termlist .btn{justify-content:flex-start}
.termmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.termmain textarea{flex:1;min-height:340px;font-family:var(--font-mono);font-size:12px;line-height:1.5;width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);resize:vertical}
.termerr{font-size:12px;color:var(--muted)}.termerr.bad{color:var(--danger)}
.termhelp{font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;color:var(--muted);margin:6px 0 0}
.termprev{background:#05090d;color:#36e07a;font-family:var(--font-mono);font-size:11px;border-radius:var(--radius);padding:8px;overflow-y:auto;max-height:60vh;display:flex;flex-direction:column;gap:8px;border:1px solid #1c2a1f}
.tpage{border:1px solid #1c3a26;padding:6px;border-radius:4px;display:flex;flex-direction:column;gap:2px}
.thead{color:#9fdcb4;font-weight:600;letter-spacing:.04em;margin-bottom:2px}
.tpic{color:#ffb040;font-size:11px}.tpic canvas{max-width:100%;height:auto;display:block;image-rendering:pixelated}.tpic.missing{color:#ff7b66}
.tline{white-space:pre-wrap;word-break:break-word}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.piccard{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);display:flex;flex-direction:column;overflow:hidden;position:relative}
.picbox{background:#000;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-width:100%;color:#888;font-size:11px;overflow:hidden}
.picbox canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain}
.picbox.small{max-width:240px;margin-bottom:6px}
.piccap{padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:11px}.piccap b{font-family:var(--font-mono);font-size:12px}.piccap span{color:var(--muted)}
.picdel{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:11px}
.lvlist{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow-y:auto}
.lvrow{display:flex;gap:4px;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2)}
.lvrow.on{border-color:var(--accent);background:var(--panel)}
.lvname{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lvname b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lvname span{font-size:11px;color:var(--muted)}
.lvctl{display:flex;gap:2px;align-items:center;padding-right:4px}.lvctl .btn{padding:2px 6px;font-size:12px}
@media (max-width: 860px){.termed{grid-template-columns:minmax(0,1fr)}.termlist{flex-direction:row;flex-wrap:wrap;max-height:none}}
/* retro dressing */
html[data-ui="retro"] .menu{background:#fff;border-bottom:2px solid #000}
html[data-ui="retro"] .brand{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:18px}
html[data-ui="retro"] .btn{background:#fff;border:1px solid #000;border-radius:5px;box-shadow:none}
html[data-ui="retro"] .btn:active,html[data-ui="retro"] .btn.on{background:#000;color:#fff}
html[data-ui="retro"] .btn.primary{background:#fff;color:#000;border-width:2px;box-shadow:inset 0 0 0 1px #fff, 0 0 0 1px #000;font-weight:600}
html[data-ui="retro"] .tools,html[data-ui="retro"] .side{border-color:#000}
html[data-ui="retro"] .tool{border:1px solid #000;border-radius:0;width:40px;height:40px}
html[data-ui="retro"] .tool[aria-pressed="true"]{background:#000;color:#fff}
html[data-ui="retro"] .tabs{background:repeating-linear-gradient(#fff 0 1px,#000 1px 2px);padding:3px 6px;gap:6px;border-bottom:1px solid #000}
html[data-ui="retro"] .tabs button{background:#fff;font-family:var(--font-display);font-size:13px;color:#000;border:1px solid #000;border-bottom:1px solid #000;padding:2px 6px}
html[data-ui="retro"] .tabs button[aria-selected="true"]{background:#000;color:#fff}
html[data-ui="retro"] .pane h3{font-family:var(--font-display);font-weight:600}
html[data-ui="retro"] .dialog{border:2px solid #000;box-shadow:3px 3px 0 #000;border-radius:0}
html[data-ui="retro"] .dialog header{background:repeating-linear-gradient(#fff 0 1px,#000 1px 2px);border-bottom:2px solid #000}
html[data-ui="retro"] .dialog header h2{background:#fff;padding:0 8px;font-size:16px}
html[data-ui="retro"] .legend,html[data-ui="retro"] .hint{border:1px solid #000;box-shadow:2px 2px 0 #000}
html[data-ui="retro"] .optbar{background:#fff;border-bottom:1px solid #000}
html[data-ui="retro"] .canvasbox{background:#fff}
html[data-ui="retro"] .issue i{border-radius:0}
@media (max-width: 860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto;
    grid-template-areas:"menu" "tools" "map" "side" "status"}
  .tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:6px max(12px,env(safe-area-inset-left,0px))}
  .tools hr{border-top:0;border-left:1px solid var(--line);margin:2px 4px;height:auto}
  .mapwrap{height:62vh;min-height:340px}
  .side{border-left:0;border-top:1px solid var(--line);max-height:none}
  .pane{overflow:visible}
  .hint{display:none}
  .status .hide-sm{display:none}
}
.pad button[data-a]{font-size:12px}
@media (pointer: fine){.pad{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="menu">
    <div class="brand">Forge <small id="brandGame">REMAKE</small></div>
    <div class="mgroup">
      <button class="btn" id="bNew" title="Start a new level for Marathon, Durandal or Infinity">New…</button>
      <button class="btn" id="bOpen" title="Open a saved project or a Marathon map file (single levels or a whole scenario)">Open…</button>
      <button class="btn" id="bSave" title="Save this level as a project file">Save project</button>
      <button class="btn primary" id="bExport" title="Export a map Aleph One can play">Export for Aleph One</button>
    </div>
    <div class="sep"></div>
    <div class="mgroup">
      <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    </div>
    <div class="sep"></div>
    <div class="mgroup">
      <button class="btn" id="bGen" title="Describe a level and lay it out">Generate…</button>
      <button class="btn" id="b3d" title="Walk through the level in 3D (Tab)">3D view</button>
      <button class="btn" id="bPaint" title="Walk the level and paint textures (P)">Paint in 3D</button>
      <button class="btn" id="bShapes" title="Load the Shapes files that hold each game's textures">Shapes 0/3</button>
    </div>
    <div class="spacer"></div>
    <div class="mgroup">
      <span class="note" style="font-size:11px">Look</span>
      <div class="viewmodes" role="group" aria-label="Interface style">
        <button id="uiModern" aria-pressed="true">Modern</button>
        <button id="uiRetro" aria-pressed="false">Retro</button>
      </div>
    </div>
    <input type="file" id="fileIn" hidden>
  </header>

  <nav class="tools" id="tools" aria-label="Tools"></nav>

  <section class="mapwrap">
    <div class="optbar" id="optbar"></div>
    <div class="canvasbox" id="canvasbox">
      <canvas id="map" aria-label="Level map"></canvas>
      <div class="legend" id="legend" hidden></div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button role="tab" id="tInspect" aria-selected="true">Inspector</button>
      <button role="tab" id="tLevel" aria-selected="false">Level</button>
      <button role="tab" id="tLevels" aria-selected="false">Levels</button>
      <button role="tab" id="tIssues" aria-selected="false">Checks <span class="count z" id="issueCount">0</span></button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>

  <footer class="status">
    <span id="sCursor">x 0.000 · y 0.000</span>
    <span id="sZoom" class="hide-sm">zoom 100%</span>
    <span id="sCounts">0 polygons</span>
    <span class="msg" id="sMsg">Ready.</span>
  </footer>
</div>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
