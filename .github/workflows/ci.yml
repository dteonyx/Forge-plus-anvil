name: Build and test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Install the test browser
        run: npx -w apps/forge playwright install --with-deps chromium
      - name: Build the web app
        run: npm run build
      - name: Test
        run: npm test
